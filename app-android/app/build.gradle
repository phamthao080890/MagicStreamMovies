plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'jacoco' }

android {
    namespace 'com.magicstreammovies'
    compileSdk 35

    defaultConfig {
        applicationId 'com.magicstreammovies'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'API_BASE_URL', '"https://magicstreammovies-h6ww.onrender.com/api/"'
    }
    buildFeatures { buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

jacoco { toolVersion = '0.8.12' }

tasks.withType(Test).configureEach {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ['jdk.internal.*']
}

tasks.register('unitTestCoverage', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(fileTree("$buildDir/tmp/kotlin-classes/debug") {
        exclude '**/BuildConfig.*', '**/R.class', '**/R$*.class'
    })
    sourceDirectories.setFrom(files('src/main/kotlin'))
    executionData.setFrom(fileTree(buildDir) { include 'jacoco/testDebugUnitTest.exec' })
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
